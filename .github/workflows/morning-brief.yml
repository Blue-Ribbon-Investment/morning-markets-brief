name: Morning Markets Brief

on:
  schedule:
    - cron: '0 2 * * *'     # 07:30 IST
    - cron: '30 2 * * *'    # 08:00 IST
    - cron: '0 3 * * *'     # 08:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if today is already out'
        required: false
        default: 'false'

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    env:
      PAGE_URL: https://blue-ribbon-investment.github.io/morning-markets-brief/
      HAS_MAIL: ${{ secrets.GMAIL_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set today's date (IST)
        run: |
          echo "DATE=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_ENV"
          echo "DATE_LABEL=$(TZ=Asia/Kolkata date '+%A %-d %B %Y')" >> "$GITHUB_ENV"

      - name: Skip if today's edition is already published
        id: gate
        run: |
          if [ "${{ inputs.force }}" != "true" ] && curl -fsSL "$PAGE_URL?nocache=$(date +%s)" | grep -q "$DATE_LABEL"; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Today's edition ($DATE_LABEL) is already published. Nothing to do."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch market numbers and headlines
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 -I -X utf8 fetch_numbers.py "runs/$DATE" || true
          python3 -I -X utf8 fetch_news.py "runs/$DATE" 30 || true

      - name: Claude writes the brief
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
        run: python3 -I -X utf8 write_brief.py "runs/$DATE" "$DATE_LABEL"

      - name: Check the brief was written
        if: steps.gate.outputs.go == 'true'
        run: test -s "runs/$DATE/content.html"

      - name: Build the website and the email
        if: steps.gate.outputs.go == 'true'
        run: python3 -I -X utf8 build_site.py "runs/$DATE/content.html" site out "$DATE_LABEL" "$(TZ=Asia/Kolkata date '+%-I:%M %p')" "$PAGE_URL"

      - name: Upload the website
        if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Email the brief
        if: steps.gate.outputs.go == 'true' && env.HAS_MAIL == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 -I -X utf8 send_email.py out/email.html "Morning Markets Brief · $DATE_LABEL" "$PAGE_URL"

  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch last_run.txt twice a month
        run: |
          DAY=$(TZ=Asia/Kolkata date +%d)
          if [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; then
            TZ=Asia/Kolkata date '+%F %H:%M IST' > last_run.txt
            git config user.name "morning-brief-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_run.txt
            git commit -m "Keep the daily schedule active" && git push || true
          fi
